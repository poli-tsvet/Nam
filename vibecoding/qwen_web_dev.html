<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PyCamp — Бесплатный курс Python</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
<style>
  :root{
    --bg:#0a0a23;
    --bg-2:#1b1b32;
    --bg-3:#2a2a40;
    --text:#dfdfe2;
    --muted:#858591;
    --accent:#f1be32;
    --accent-2:#ffbf00;
    --green:#3bdf3b;
    --red:#ff6b6b;
    --border:#3b3b4f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
    overflow-x:hidden;
  }
  a{color:var(--accent);text-decoration:none}
  a:hover{color:var(--accent-2)}
  button{font-family:inherit;cursor:pointer}

  /* Header */
  header{
    position:sticky;top:0;z-index:100;
    background:var(--bg-2);
    border-bottom:2px solid var(--accent);
    padding:12px 24px;
    display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:12px;
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:var(--accent);cursor:pointer}
  .logo svg{width:32px;height:32px}
  nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  nav a,nav button{
    background:none;border:none;color:var(--text);font-size:14px;
    padding:6px 10px;border-radius:4px;transition:.2s;
  }
  nav a:hover,nav button:hover{background:var(--bg-3);color:var(--accent)}
  .progress-mini{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .progress-mini .bar{width:100px;height:6px;background:var(--bg-3);border-radius:3px;overflow:hidden}
  .progress-mini .fill{height:100%;background:var(--accent);transition:width .4s}

  /* Layout */
  main{min-height:calc(100vh - 130px);padding:24px;max-width:1400px;margin:0 auto}
  .container{max-width:900px;margin:0 auto}

  /* Home */
  .hero{text-align:center;padding:60px 20px 40px}
  .hero h1{font-size:clamp(32px,5vw,56px);margin-bottom:16px;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{font-size:18px;color:var(--muted);max-width:700px;margin:0 auto 30px}
  .btn{
    display:inline-block;padding:14px 28px;border-radius:6px;
    background:var(--accent);color:var(--bg);font-weight:700;font-size:16px;
    border:none;transition:.2s;text-decoration:none;
  }
  .btn:hover{background:var(--accent-2);transform:translateY(-2px)}
  .btn.secondary{background:transparent;color:var(--accent);border:2px solid var(--accent)}
  .btn.secondary:hover{background:var(--accent);color:var(--bg)}
  .btn.ghost{background:var(--bg-3);color:var(--text)}
  .btn.ghost:hover{background:var(--border)}

  .features{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin:40px 0}
  .feature{background:var(--bg-2);padding:24px;border-radius:8px;border:1px solid var(--border)}
  .feature h3{color:var(--accent);margin-bottom:8px;font-size:18px}
  .feature p{color:var(--muted);font-size:14px}

  /* Curriculum */
  .curriculum{margin-top:40px}
  .curriculum h2{font-size:28px;margin-bottom:20px;text-align:center}
  .module{background:var(--bg-2);border:1px solid var(--border);border-radius:8px;margin-bottom:12px;overflow:hidden}
  .module-header{padding:16px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:.2s}
  .module-header:hover{background:var(--bg-3)}
  .module-header h3{font-size:17px;color:var(--text)}
  .module-header .arrow{transition:.3s;color:var(--accent)}
  .module.open .arrow{transform:rotate(180deg)}
  .module-body{max-height:0;overflow:hidden;transition:max-height .4s}
  .module.open .module-body{max-height:2000px}
  .lesson-list{padding:0 20px 16px;list-style:none}
  .lesson-item{
    padding:10px 14px;margin:4px 0;border-radius:6px;
    display:flex;justify-content:space-between;align-items:center;
    background:var(--bg-3);cursor:pointer;transition:.2s;font-size:14px;
  }
  .lesson-item:hover{background:var(--border);transform:translateX(4px)}
  .lesson-item.done{border-left:3px solid var(--green)}
  .lesson-item .check{color:var(--green);font-weight:700}
  .module-progress{font-size:12px;color:var(--muted);margin-left:10px}

  /* Lesson view */
  .lesson-view{display:grid;grid-template-columns:1fr 1fr;gap:20px;min-height:70vh}
  @media(max-width:900px){.lesson-view{grid-template-columns:1fr}}
  .lesson-content{background:var(--bg-2);padding:28px;border-radius:8px;border:1px solid var(--border);overflow-y:auto;max-height:80vh}
  .lesson-content h1{color:var(--accent);margin-bottom:16px;font-size:26px}
  .lesson-content h2{color:var(--accent-2);margin:20px 0 10px;font-size:20px}
  .lesson-content p{margin-bottom:12px;color:var(--text)}
  .lesson-content code{background:var(--bg-3);padding:2px 6px;border-radius:4px;font-family:"Courier New",monospace;color:var(--accent);font-size:14px}
  .lesson-content pre{background:var(--bg);padding:14px;border-radius:6px;overflow-x:auto;margin:12px 0;border:1px solid var(--border)}
  .lesson-content pre code{background:none;padding:0;color:var(--text);font-size:13px}
  .lesson-content ul,.lesson-content ol{margin:12px 0 12px 24px}
  .lesson-content li{margin-bottom:6px}
  .lesson-content .hint{background:rgba(241,190,50,.1);border-left:3px solid var(--accent);padding:10px 14px;margin:14px 0;border-radius:4px;font-size:14px}

  .editor-panel{display:flex;flex-direction:column;gap:10px}
  .editor-toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .editor-toolbar .task{font-size:14px;color:var(--muted);flex:1}
  .editor-toolbar .task strong{color:var(--accent)}
  textarea.editor{
    flex:1;min-height:300px;
    background:var(--bg);color:var(--text);
    border:1px solid var(--border);border-radius:8px;
    padding:16px;font-family:"Courier New",monospace;font-size:14px;
    resize:vertical;outline:none;transition:.2s;
    line-height:1.5;
  }
  textarea.editor:focus{border-color:var(--accent)}
  .output{
    background:var(--bg);border:1px solid var(--border);border-radius:8px;
    padding:14px;min-height:80px;max-height:200px;overflow-y:auto;
    font-family:"Courier New",monospace;font-size:13px;
    white-space:pre-wrap;
  }
  .output.success{border-color:var(--green);color:var(--green)}
  .output.error{border-color:var(--red);color:var(--red)}
  .output.loading{color:var(--muted)}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap}

  /* Footer */
  footer{background:var(--bg-2);padding:24px;text-align:center;color:var(--muted);font-size:14px;border-top:1px solid var(--border);margin-top:40px}

  /* Certificate */
  .cert{
    background:linear-gradient(135deg,#1b1b32,#0a0a23);
    border:3px solid var(--accent);border-radius:12px;
    padding:50px 30px;text-align:center;max-width:700px;margin:40px auto;
    box-shadow:0 10px 40px rgba(241,190,50,.2);
  }
  .cert h1{color:var(--accent);font-size:36px;margin-bottom:10px}
  .cert h2{color:var(--text);font-size:24px;margin-bottom:20px;font-weight:400}
  .cert .name{font-size:40px;color:var(--accent-2);margin:20px 0;font-weight:700;border-bottom:2px solid var(--border);padding-bottom:10px}
  .cert .date{color:var(--muted);margin-top:20px}
  .cert .seal{font-size:60px;margin:20px 0}

  /* Scrollbar */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent)}

  /* Toast */
  .toast{
    position:fixed;bottom:20px;right:20px;
    background:var(--bg-2);border:1px solid var(--accent);
    padding:14px 20px;border-radius:8px;
    color:var(--text);z-index:200;
    animation:slideIn .3s;
  }
  @keyframes slideIn{from{transform:translateX(400px);opacity:0}to{transform:translateX(0);opacity:1}}

  .breadcrumb{font-size:13px;color:var(--muted);margin-bottom:16px}
  .breadcrumb a{color:var(--accent)}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin:30px 0}
  .stat{background:var(--bg-2);padding:20px;border-radius:8px;text-align:center;border:1px solid var(--border)}
  .stat .num{font-size:32px;color:var(--accent);font-weight:700}
  .stat .label{color:var(--muted);font-size:13px;margin-top:4px}

  .name-input{
    background:var(--bg);color:var(--text);border:2px solid var(--accent);
    padding:12px 16px;border-radius:6px;font-size:16px;width:100%;max-width:400px;
    margin:20px auto;display:block;text-align:center;outline:none;
  }
</style>
</head>
<body>

<header>
  <div class="logo" onclick="navigate('home')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    <span>PyCamp</span>
  </div>
  <nav>
    <a onclick="navigate('home')">Главная</a>
    <a onclick="navigate('curriculum')">Курс</a>
    <a onclick="navigate('playground')">Песочница</a>
    <a onclick="navigate('certificate')">Сертификат</a>
    <div class="progress-mini">
      <span id="progressText">0%</span>
      <div class="bar"><div class="fill" id="progressFill" style="width:0%"></div></div>
    </div>
  </nav>
</header>

<main id="app"></main>

<footer>
  <p>© 2026 PyCamp — Бесплатное обучение Python. Создано с ❤️ для сообщества.</p>
  <p style="margin-top:8px;font-size:12px">Python выполняется в браузере через Pyodide</p>
</footer>

<script>
/* ============================================================
   CURRICULUM DATA
   ============================================================ */
const CURRICULUM = [
  {
    title: "Модуль 1: Введение в Python",
    lessons: [
      {
        id:"1-1", title:"Что такое Python?",
        content:`
<h1>Что такое Python?</h1>
<p>Python — это высокоуровневый язык программирования общего назначения, созданный <strong>Гвидо ван Россумом</strong> в 1991 году. Он известен своим чистым синтаксисом и читаемостью кода.</p>
<h2>Почему Python?</h2>
<ul>
<li>Простой и понятный синтаксис</li>
<li>Огромное сообщество и библиотека</li>
<li>Применяется в веб-разработке, Data Science, AI, автоматизации</li>
<li>Кроссплатформенный</li>
</ul>
<h2>Ваша первая программа</h2>
<p>Традиционно первая программа выводит "Hello, World!". В Python это делается одной строкой:</p>
<pre><code>print("Hello, World!")</code></pre>
<p>Функция <code>print()</code> выводит текст на экран. Текст заключается в кавычки — это строка (string).</p>
<div class="hint">💡 <strong>Задание:</strong> Выведите на экран фразу <code>Hello, PyCamp!</code></div>
`,
        starter:`# Выведите "Hello, PyCamp!"\n`,
        test:(output)=> output.trim()==="Hello, PyCamp!",
        hint:"Используйте print(\"Hello, PyCamp!\")"
      },
      {
        id:"1-2", title:"Комментарии",
        content:`
<h1>Комментарии в Python</h1>
<p>Комментарии — это пояснения в коде, которые игнорируются интерпретатором. Они помогают другим (и вам в будущем) понять логику программы.</p>
<h2>Однострочные комментарии</h2>
<p>Начинаются с символа <code>#</code>:</p>
<pre><code># Это комментарий
print("Привет")  # И это тоже комментарий</code></pre>
<h2>Многострочные комментарии</h2>
<p>Используют тройные кавычки:</p>
<pre><code>"""
Это многострочный
комментарий
"""</code></pre>
<div class="hint">💡 <strong>Задание:</strong> Добавьте комментарий к коду и выведите слово <code>Python</code></div>
`,
        starter:`# Добавьте комментарий\nprint("Python")\n`,
        test:(output)=> output.trim()==="Python",
        hint:"Добавьте строку с # и оставьте print(\"Python\")"
      },
      {
        id:"1-3", title:"Арифметические операции",
        content:`
<h1>Арифметические операции</h1>
<p>Python поддерживает все базовые математические операции:</p>
<ul>
<li><code>+</code> — сложение</li>
<li><code>-</code> — вычитание</li>
<li><code>*</code> — умножение</li>
<li><code>/</code> — деление (результат — float)</li>
<li><code>//</code> — целочисленное деление</li>
<li><code>%</code> — остаток от деления</li>
<li><code>**</code> — возведение в степень</li>
</ul>
<pre><code>print(10 + 5)   # 15
print(10 / 3)   # 3.333...
print(10 // 3)  # 3
print(10 % 3)   # 1
print(2 ** 10)  # 1024</code></pre>
<div class="hint">💡 <strong>Задание:</strong> Вычислите и выведите результат <code>17 * 23</code></div>
`,
        starter:`# Выведите результат 17 * 23\nprint(17 * 23)\n`,
        test:(output)=> output.trim()==="391",
        hint:"print(17 * 23)"
      }
    ]
  },
  {
    title: "Модуль 2: Переменные и типы данных",
    lessons: [
      {
        id:"2-1", title:"Переменные",
        content:`
<h1>Переменные</h1>
<p>Переменная — это именованная ячейка памяти для хранения данных. В Python не нужно объявлять тип — он определяется автоматически.</p>
<pre><code>name = "Алиса"
age = 25
height = 1.68
is_student = True

print(name)
print(age)</code></pre>
<h2>Правила именования</h2>
<ul>
<li>Могут содержать буквы, цифры, символ подчёркивания <code>_</code></li>
<li>Не могут начинаться с цифры</li>
<li>Регистр имеет значение: <code>Name</code> и <code>name</code> — разные переменные</li>
<li>Нельзя использовать зарезервированные слова (if, for, class и т.д.)</li>
</ul>
<div class="hint">💡 <strong>Задание:</strong> Создайте переменную <code>language</code> со значением <code>"Python"</code> и выведите её</div>
`,
        starter:`# Создайте переменную language\nlanguage = "Python"\nprint(language)\n`,
        test:(output)=> output.trim()==="Python",
        hint:"language = \"Python\" и print(language)"
      },
      {
        id:"2-2", title:"Типы данных",
        content:`
<h1>Основные типы данных</h1>
<ul>
<li><code>int</code> — целые числа: <code>42</code>, <code>-7</code></li>
<li><code>float</code> — дробные числа: <code>3.14</code>, <code>-0.5</code></li>
<li><code>str</code> — строки: <code>"Привет"</code></li>
<li><code>bool</code> — логический тип: <code>True</code> или <code>False</code></li>
<li><code>NoneType</code> — отсутствие значения: <code>None</code></li>
</ul>
<h2>Функция type()</h2>
<p>Узнать тип переменной можно с помощью <code>type()</code>:</p>
<pre><code>x = 42
print(type(x))  # &lt;class 'int'&gt;

y = "hello"
print(type(y))  # &lt;class 'str'&gt;</code></pre>
<div class="hint">💡 <strong>Задание:</strong> Выведите тип числа <code>3.14</code> (должно быть <code>&lt;class 'float'&gt;</code>)</div>
`,
        starter:`# Выведите тип числа 3.14\nprint(type(3.14))\n`,
        test:(output)=> output.trim().includes("float"),
        hint:"print(type(3.14))"
      },
      {
        id:"2-3", title:"Преобразование типов",
        content:`
<h1>Преобразование типов</h1>
<p>Иногда нужно преобразовать один тип в другой:</p>
<pre><code># В строку
str(42)        # "42"
str(3.14)      # "3.14"

# В целое число
int("42")      # 42
int(3.9)       # 3 (отбрасывает дробную часть)

# В дробное число
float("3.14")  # 3.14
float(5)       # 5.0</code></pre>
<h2>Пример</h2>
<pre><code>age = "25"
age_num = int(age)
print(age_num + 5)  # 30</code></pre>
<div class="hint">💡 <strong>Задание:</strong> Преобразуйте строку <code>"100"</code> в число и прибавьте 50. Выведите результат.</div>
`,
        starter:`# Преобразуйте "100" в число и прибавьте 50\nresult = int("100") + 50\nprint(result)\n`,
        test:(output)=> output.trim()==="150",
        hint:"int(\"100\") + 50"
      },
      {
        id:"2-4", title:"Ввод данных",
        content:`
<h1>Ввод данных от пользователя</h1>
<p>Функция <code>input()</code> позволяет получить данные от пользователя. Результат всегда строка!</p>
<pre><code>name = input()
print("Привет,", name)</code></pre>
<p>Обычно в <code>input()</code> передают подсказку:</p>
<pre><code>name = input("Как вас зовут? ")
age = int(input("Ваш возраст: "))
print(f"Вам {age} лет")</code></pre>
<div class="hint">💡 <strong>Задание:</strong> Так как в браузере ввод недоступен, используйте переменную <code>name = "Мир"</code> и выведите <code>Привет, Мир</code></div>
`,
        starter:`name = "Мир"\nprint("Привет,", name)\n`,
        test:(output)=> output.trim()==="Привет, Мир",
        hint:"print(\"Привет,\", name)"
      }
    ]
  },
  {
    title: "Модуль 3: Строки",
    lessons: [
      {
        id:"3-1", title:"Основы строк",
        content:`
<h1>Строки в Python</h1>
<p>Строка — это последовательность символов. Создаётся в одинарных или двойных кавычках:</p>
<pre><code>s1 = "Hello"
s2 = 'World'
s3 = """Многострочная
строка"""</code></pre>
<h2>Конкатенация и повторение</h2>
<pre><code>print("Hello" + " " + "World")  # Hello World
print("Hi! " * 3)               # Hi! Hi! Hi! </code></pre>
<h2>Длина строки</h2>
<pre><code>print(len("Python"))  # 6</code></pre>
<div class="hint">💡 <strong>Задание:</strong> Создайте строку <code>"Py"</code> и повторите её 5 раз через оператор <code>*</code>. Выведите результат.</div>
`,
        starter:`# Повторите "Py" 5 раз\nprint("Py" * 5)\n`,
        test:(output)=> output.trim()==="PyPyPyPyPy",
        hint:"print(\"Py\" * 5)"
      },
      {
        id:"3-2", title:"Индексы и срезы",
        content:`
<h1>Индексы и срезы строк</h1>
<p>Каждый символ имеет индекс, начиная с <code>0</code>:</p>
<pre><code>s = "Python"
print(s[0])    # P
print(s[5])    # n
print(s[-1])   # n (с конца)</code></pre>
<h2>Срезы</h2>
<p>Срез <code>s[start:stop:step]</code> получает подстроку:</p>
<pre><code>s = "Hello, World!"
print(s[0:5])     # Hello
print(s[7:])      # World!
print(s[:5])      # Hello
print(s[::2])     # Hlo ol!
print(s[::-1])    # !dlroW ,olleH (разворот)</code></pre>
<div class="hint">💡 <strong>Задание:</strong> Из строки <code>"Python"</code> получите срез <code>"yth"</code> (символы с индексами 1, 2, 3)</div>
`,
        starter:`s = "Python"\nprint(s[1:4])\n`,
        test:(output)=> output.trim()==="yth",
        hint:"s[1:4]"
      },
      {
        id:"3-3", title:"Методы строк",
        content:`
<h1>Методы строк</h1>
<p>Строки имеют множество полезных методов:</p>
<pre><code>s = "Hello, World!"

print(s.upper())       # HELLO, WORLD!
print(s.lower())       # hello, world!
print(s.capitalize())  # Hello, world!
print(s.title())       # Hello, World!

const STATE = {
  completed: JSON.parse(localStorage.getItem("pycamp_completed") || "[]"),
  currentLesson: null,
  pyodide: null,
  pyodideReady: false,
  pyodideLoading: false,
};

function saveState(){
  localStorage.setItem("pycamp_completed", JSON.stringify(STATE.completed));
  updateProgress();
}

function totalLessons(){
  return CURRICULUM.reduce((a,m)=>a+m.lessons.length, 0);
}

function updateProgress(){
  const total = totalLessons();
  const done = STATE.completed.length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById("progressText").textContent = pct+"%";
  document.getElementById("progressFill").style.width = pct+"%";
}

/* ============================================================
   ROUTER
   ============================================================ */
function navigate(route, param){
  location.hash = param ? `${route}/${param}` : route;
}

function render(){
  const hash = location.hash.slice(1) || "home";
  const [route, param] = hash.split("/");
  const app = document.getElementById("app");
  window.scrollTo(0,0);

  if(route === "home" || route === ""){
    renderHome(app);
  } else if(route === "curriculum"){
    renderCurriculum(app);
  } else if(route === "lesson"){
    renderLesson(app, param);
  } else if(route === "playground"){
    renderPlayground(app);
  } else if(route === "certificate"){
    renderCertificate(app);
  } else {
    renderHome(app);
  }
  updateProgress();
}

window.addEventListener("hashchange", render);

function renderCurriculum(app){

function toggleModule(i){

/* ============================================================
   LESSON PAGE
   ============================================================ */
function findLesson(id){
  for(const m of CURRICULUM){
    for(const l of m.lessons){
      if(l.id === id) return {lesson:l, module:m};
    }
  }
  return null;
}

function getAdjacentLessons(id){
  const all = CURRICULUM.flatMap(m=>m.lessons);
  const idx = all.findIndex(l=>l.id===id);
  return {
    prev: idx>0 ? all[idx-1] : null,
    next: idx<all.length-1 ? all[idx+1] : null
  };
}

function renderLesson(app, id){
  const found = findLesson(id);
  if(!found){ navigate('curriculum'); return; }
  const {lesson, module} = found;
  const adj = getAdjacentLessons(id);
  STATE.currentLesson = lesson;

  app.innerHTML = `
    <div class="breadcrumb">
      <a onclick="navigate('curriculum')">Курс</a> / 
      <a onclick="navigate('curriculum')">${module.title}</a> /

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function resetCode(){
  if(STATE.currentLesson){
    document.getElementById("codeEditor").value = STATE.currentLesson.starter;

}

function showHint(){
  if(STATE.currentLesson){
    toast("💡 " + STATE.currentLesson.hint);
  }

/* ============================================================
   PYODIDE
   ============================================================ */
async function ensurePyodide(){
  if(STATE.pyodideReady) return;
  if(STATE.pyodideLoading) return;
  STATE.pyodideLoading = true;
  const out = document.getElementById("output");
  if(out){
    out.className = "output loading";
    out.textContent = "⏳ Загрузка Python... Это может занять несколько секунд при первом запуске.";
  }
  try{
    STATE.pyodide = await loadPyodide({
      indexURL: "https://cdn.jsdelivr.net/pyodide/v0.25.1/full/"
    });
    STATE.pyodideReady = true;
    STATE.pyodideLoading = false;
    if(out){
      out.className = "output";
      out.textContent = "✅ Python готов к работе!";
    }
  }catch(e){
    STATE.pyodideLoading = false;
    if(out){
      out.className = "output error";
      out.textContent = "❌ Ошибка загрузки Python: " + e.message;
    }
  }
}

async function runCode(){
  const code = document.getElementById("codeEditor").value;
  const out = document.getElementById("output");
  if(!STATE.pyodideReady){
    await ensurePyodide();
    if(!STATE.pyodideReady) return;
  }
  out.className = "output loading";
  out.textContent = "⏳ Выполнение...";
  try{
    STATE.pyodide.runPython(`
import sys
from io import StringIO
sys.stdout = StringIO()
sys.stderr = StringIO()
`);
    STATE.pyodide.runPython(code);
    const stdout = STATE.pyodide.runPython("sys.stdout.getvalue()");
    const stderr = STATE.pyodide.runPython("sys.stderr.getvalue()");
    if(stderr){
      out.className = "output error";
      out.textContent = stderr;
    } else {
      out.className = "output success";
      out.textContent = stdout || "(нет вывода)";
    }
  }catch(e){
    out.className = "output error";
    out.textContent = "❌ " + e.message;
  }
}

async function checkSolution(){
  const code = document.getElementById("codeEditor").value;
  const out = document.getElementById("output");
  const lesson = STATE.currentLesson;
  if(!lesson) return;

  if(!STATE.pyodideReady){
    await ensurePyodide();
    if(!STATE.pyodideReady) return;
  }

  out.className = "output loading";
  out.textContent = "⏳ Проверка...";
  try{
    STATE.pyodide.runPython(`
import sys
from io import StringIO
sys.stdout = StringIO()
sys.stderr = StringIO()
`);
    STATE.pyodide.runPython(code);
    const stdout = STATE.pyodide.runPython("sys.stdout.getvalue()");
    const stderr = STATE.pyodide.runPython("sys.stderr.getvalue()");

    if(stderr){
      out.className = "output error";
      out.textContent = "❌ Ошибка:\n" + stderr;
      return;
    }

    const ok = lesson.test(stdout);
    if(ok){
      out.className = "output success";
      out.textContent = "✅ Отлично! Задание выполнено верно!\n\nВывод:\n" + stdout;
      if(!STATE.completed.includes(lesson.id)){
        STATE.completed.push(lesson.id);
        saveState();
        toast("🎉 Урок пройден! Прогресс сохранён.");
      }
    } else {
      out.className = "output error";
      out.textContent = "❌ Неверный результат.\n\nВаш вывод:\n" + stdout + "\n\nПопробуйте ещё раз! Подсказка: " + lesson.hint;
    }
  }catch(e){
    out.className = "output error";
    out.textContent = "❌ Ошибка:\n" + e.message;
  }
}

        <div style="color:var(--muted);font-size:14px;letter-spacing:2px">PYTHON FUNDAMENTALS</div>
        <div class="name" id="certNameDisplay">${savedName || "Ваше Имя"}</div>
        <p style="color:var(--text)">успешно завершил(а) полный интерактивный курс Python на платформе PyCamp, освоив переменные, типы данных, условия, циклы, функции, структуры данных, ООП и алгоритмы.</p>
        <div class="date">Выдан: ${new Date().toLocaleDateString('ru-RU', {day:'numeric',month:'long',year:'numeric'})}</div>
        <div style="margin-top:20px;color:var(--muted);font-size:12px">ID: PYCAMP-${Date.now().toString(36).toUpperCase()}</div>
      </div>
      <button class="btn" onclick="window.print()">🖨 Распечатать</button>
      <button class="btn secondary" onclick="resetProgress()" style="margin-left:10px">Сбросить прогресс</button>
    </div>
  `;
}

function updateCertName(){
  const name = document.getElementById("certName").value;
  document.getElementById("certNameDisplay").textContent = name || "Ваше Имя";
  localStorage.setItem("pycamp_cert_name", name);
}

function resetProgress(){
  if(confirm("Вы уверены? Весь прогресс будет удалён.")){
    STATE.completed = [];
    localStorage.removeItem("pycamp_completed");
    localStorage.removeItem("pycamp_cert_name");
    saveState();
    toast("Прогресс сброшен");
    navigate("home");
  }
}

/* ============================================================
   UTILS
   ============================================================ */
function toast(msg){
  const existing = document.querySelector(".toast");
  if(existing) existing.remove();
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3500);
}

/* ============================================================
   INIT
   ============================================================ */
render();
updateProgress();
</script>
</body>
</html>
